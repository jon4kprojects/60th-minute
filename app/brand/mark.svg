<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="60th Minute">
  <defs>
    <linearGradient id="g" x1="8" y1="14" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB020"/><stop offset=".45" stop-color="#FF7A18"/><stop offset="1" stop-color="#FF3D2E"/>
    </linearGradient>
  </defs>
  <!-- remaining 30 minutes -->
  <circle cx="60" cy="60" r="43" fill="none" stroke="#252935" stroke-width="9"/>
  <!-- 60 of 90 minutes elapsed = 240 degrees -->
  <path d="M60 17 A43 43 0 1 1 22.76 81.5" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <text x="60" y="60" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="43" font-weight="800" letter-spacing="-2.5" fill="#F7F8FA">60<tspan fill="url(#g)">′</tspan></text>
</svg>

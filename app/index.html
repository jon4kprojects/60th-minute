<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="60th Minute">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./icon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<link rel="stylesheet" href="./css/style.css">
<title>60th Minute — football quiz</title>
</head>
<body>
<!-- Inline so it paints before any script runs: the ring sweeps to 60 minutes
     while the dataset loads, rather than the app arriving with a thud. -->
<div id="splash" class="splash">
  <svg viewBox="0 0 120 120" width="112" height="112" aria-hidden="true">
    <defs>
      <linearGradient id="sg" x1="8" y1="14" x2="112" y2="108" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFB020"/><stop offset=".45" stop-color="#FF7A18"/>
        <stop offset="1" stop-color="#FF3D2E"/>
      </linearGradient>
    </defs>
    <circle cx="60" cy="60" r="43" fill="none" stroke="#252935" stroke-width="9"/>
    <path id="sweep" d="M60 17 A43 43 0 1 1 22.76 81.5" fill="none" stroke="url(#sg)"
          stroke-width="9" stroke-linecap="round"/>
    <text x="60" y="60" text-anchor="middle" dominant-baseline="central" class="sn"
          font-size="43" font-weight="800" letter-spacing="-2.5" fill="#F7F8FA">60<tspan fill="url(#sg)">′</tspan></text>
  </svg>
  <div class="sword">60TH <b>MINUTE</b></div>
</div>
<div id="app" class="app"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
